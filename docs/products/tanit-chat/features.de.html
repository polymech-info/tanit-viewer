 in the app, or tanit-cli service for pages, files, posts, and pictures"}]}]},{"id":"automation","label":"Automatisierung","icon":"xblox","description":"Den Ablauf als XBlox-Flow festhalten — LLM-Agent mit Dateieingabe, Modellen, OCR, Vision, Audio, Bedingungen, Schleifen und gespeicherter Ausgabe. Veröffentlichen in Ribbon, Launcher, Tanit oder dem Explorer-Kontextmenü.","slides":[{"id":"overview","title":"Aus einem Chat wird ein Befehl","description":"Wenn die Aufgabe sich wiederholt, den erfolgreichen Ablauf speichern und auf der nächsten Auswahl ausführen.","media":{"type":"image","src":"./screenshots/automation.jpg"},"highlights":[{"icon":"xblox","title":"Visuelle XBlox-Flows","text":"Agent + Dateien + Modelle + Bedingungen in einem Graphen","slide":"overview"},{"icon":"command","title":"Überall veröffentlichen","text":"Ribbon, Launcher, Tanit oder Explorer-Kontextmenü","slide":"launcher"},{"icon":"html","title":"Browser-Use-Flows","text":"Ein Formular oder eine Seite aus einem gespeicherten Befehl steuern","slide":"browser"},{"icon":"command","title":"Ein-Klick-Wiederholung","text":"Die nächste Datei läuft denselben geprüften Prozess","slide":"overview"}],"actions":[{"label":"Tanit Chat holen — kostenlos","primary":true,"href":"https://apps.microsoft.com/detail/9N5F39064NPD"}]},{"id":"launcher","title":"Im Launcher veröffentlicht","description":"Ein fertiger Flow wird ein Befehl, den du ohne Editor starten kannst.","media":{"type":"image","src":"./screenshots/launcher.jpg"},"highlights":[]},{"id":"browser","title":"Browser-Use aus einem Befehl","description":"Eine Seite oder ein Formular mit demselben Flow steuern, der als Chat begann.","media":{"type":"image","src":"./screenshots/forms-browser-use.jpg"},"highlights":[]}]},{"id":"security","label":"Sicherheit","icon":"command","description":"Profile Light, Strict oder Developer. Aktion, Ziel und Risiko prüfen, dann einmal, für eine Aufgabe, für eine Sitzung, zeitlich begrenzt, immer oder nie freigeben. Administratoren setzen Richtlinie über Gruppenrichtlinie, Intune MDM oder Registry; Maschinenrichtlinie überschreibt Benutzereinstellungen.","slides":[{"id":"overview","title":"Jede Aktion freigeben","description":"Nützliche KI-Abläufe, ohne jedem Assistenten uneingeschränkten Zugriff auf Dateien, Werkzeuge oder das Netz zu geben.","highlights":[{"icon":"command","title":"Light / Strict / Developer","text":"Ein Profil dafür, wie viel der Assistent tun darf"},{"icon":"command","title":"Freigabe pro Aktion","text":"Einmal, Aufgabe, Sitzung, begrenzt, immer oder nie"},{"icon":"network","title":"Gruppenrichtlinie & Intune","text":"Maschinenrichtlinie überschreibt den Benutzer"},{"icon":"command","title":"Sandbox-Befehle","text":"Geschützte Anforderungen kann ein Nicht-Admin nicht senken"}],"actions":[{"label":"Tanit Chat holen — kostenlos","primary":true,"href":"https://apps.microsoft.com/detail/9N5F39064NPD"}],"media":null}]},{"id":"markdown","label":"Markdown","description":"Antworten mit Markdown, Tabellen, Code-Highlighting, KaTeX, Mermaid, lokalen Dateilinks, erzeugten Bildern und Live-Shell-Ausgabe. Live-XBlox-Blöcke in der Antwort; Versionsverlauf hält Änderungen fest.","slides":[{"id":"overview","title":"Reiche Antworten, mit Verlauf","description":"Die Antwort ist ein Arbeitsdokument — Diagramme, Mathematik, live Blöcke und eine Spur dessen, was sich geändert hat.","highlights":[{"title":"Markdown + Tabellen + Code","text":"Struktur in der Antwortspalte"},{"title":"KaTeX & Mermaid","text":"Mathematik und Diagramme ohne Extra-Tool"},{"title":"Live-XBlox-Blöcke","text":"Ausführbare Blöcke in der Antwort"},{"title":"Versionsverlauf","text":"Keine Änderung geht verloren, auch KI-Edits"}],"actions":[{"label":"Tanit Chat holen — kostenlos","primary":true,"href":"https://apps.microsoft.com/detail/9N5F39064NPD"}],"media":null}]}]}</script>

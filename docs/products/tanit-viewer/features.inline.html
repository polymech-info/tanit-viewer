<!-- tanit-viewer explore (inline) lang=en -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<div class="tv-explore" data-theme="light" data-lang="en">
<style>
/* Theme surface constants — flip here to revert (prev light #fafbfd, dark #0b0f17).
   Also on .tv-lightbox: overlay is appended to body (outside .tv-explore embeds). */
.tv-explore,.tv-lightbox{
  --tv-bg-light:#F7F6F5;
  --tv-bg-dark:#282828;
}
.tv-explore,.tv-explore[data-theme="light"]{
  color-scheme:light;
  --bg:var(--tv-bg-light); --ink:#0f172a; --muted:#64748b; --dim:#94a3b8;
  --accent:#2563eb; --accent-hover:#1d4ed8;
  --accent-soft:rgba(37,99,235,.08);
  --amber:#d97706;
  --panel:#ffffff; --panel-2:#f1f0ee;
  --line:rgba(15,23,42,.09); --line-strong:rgba(15,23,42,.14);
  --media:var(--tv-bg-light);
  --shadow:0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
  --side-w:240px; --radius:12px;
  --sel-bg:rgba(37,99,235,.08);
}
.tv-explore[data-theme="dark"]{
  color-scheme:dark;
  --bg:var(--tv-bg-dark); --ink:#e8eef8; --muted:#8b9bb3; --dim:#64748b;
  --accent:#3b82f6; --accent-hover:#60a5fa;
  --accent-soft:rgba(59,130,246,.14);
  --amber:#fbbf24;
  --panel:#1f1f1f; --panel-2:#242424;
  --line:rgba(148,163,184,.14); --line-strong:rgba(148,163,184,.22);
  --media:var(--tv-bg-dark);
  --shadow:0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.28);
  --side-w:240px; --radius:12px;
  --sel-bg:rgba(59,130,246,.12);
}.tv-explore,.tv-explore *{box-sizing:border-box}
.tv-explore{height:auto;min-height:480px;margin:0}
.tv-explore{
  color:var(--ink);background:var(--bg);
  font-family:"IBM Plex Sans",sans-serif;font-size:13.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  letter-spacing:-.01em;
}

/* Parent iframe-widget (?embed=1): size to content, never lock to 100dvh (mobile clip) */
html[data-pm-embed],html[data-pm-embed] body,
.tv-explore[data-pm-embed]{
  height:auto!important;min-height:0!important;overflow:visible!important;
}
html[data-pm-embed] .shell,
.tv-explore[data-pm-embed] .shell{
  height:auto!important;min-height:0!important;max-height:none!important;
  overflow:visible!important;
}
html[data-pm-embed] .sidebar,
.tv-explore[data-pm-embed] .sidebar{max-height:none!important}
html[data-pm-embed] .stage-media,
.tv-explore[data-pm-embed] .stage-media{min-height:220px}.tv-explore button,.tv-explore input{font:inherit;color:inherit}.tv-explore button{cursor:pointer;border:none;background:none}.tv-explore img,.tv-explore video{display:block;max-width:100%}.tv-explore a{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){.tv-explore *,.tv-explore *::before,.tv-explore *::after{animation:none!important;transition:none!important}}

.shell{
  display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);
  height:100%;min-height:0;gap:12px;padding:12px;
}

/* ── sidebar ── */
.sidebar{
  display:flex;flex-direction:column;min-height:0;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.side-brand{display:flex;align-items:center;gap:12px;padding:16px 14px 12px}
.side-logo{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink);display:grid;place-items:center;padding:6px;
}
.side-logo svg{width:100%;height:100%}
.side-brand strong{
  font-size:.88rem;font-weight:600;letter-spacing:-.02em;
}
.side-nav{flex:1;overflow:auto;padding:2px 8px 12px;scrollbar-width:thin}
.side-sec{
  margin:12px 0 4px;padding:0 10px;
  font-size:.72rem;font-weight:600;letter-spacing:-.01em;color:var(--dim);
}
.side-sec:first-child{margin-top:4px}
.side-item{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 10px;border-radius:10px;text-align:left;color:var(--muted);
  border:1px solid transparent;
  transition:color .12s,background .12s,border-color .12s;
}
.side-item:hover{color:var(--ink);background:var(--panel-2)}
.side-item[aria-current="true"]{
  color:var(--accent);background:var(--sel-bg);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));
}
.side-item .si{width:18px;height:18px;flex-shrink:0;color:inherit}
.side-item .si svg{width:100%;height:100%}
.side-item .sl{font-size:.88rem;font-weight:500;line-height:1.3;min-width:0}
.side-item .tour-mark{
  margin-left:auto;width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--accent);opacity:0;box-shadow:0 0 0 0 rgba(37,99,235,.45);
  transition:opacity .15s;
}
.side-item[aria-current="true"][data-tour="playing"] .tour-mark{
  opacity:1;animation:tour-pulse 1.4s ease-out infinite;
}
.side-item[aria-current="true"][data-tour="paused"] .tour-mark{opacity:.55;background:var(--amber)}
.side-item .tour-bar{
  position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:999px;
  background:rgba(37,99,235,.12);overflow:hidden;opacity:0;pointer-events:none;
}
.side-item[aria-current="true"][data-tour="playing"] .tour-bar{opacity:1}
.side-item .tour-bar > i{
  display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);
}
.side-item[aria-current="true"][data-tour="playing"][data-media="image"] .tour-bar > i{
  animation:tour-fill var(--tour-ms,4000ms) linear forwards;
}
.side-item[aria-current="true"][data-tour="playing"][data-media="video"] .tour-bar > i{
  width:40%;animation:tour-indeterminate 1.2s ease-in-out infinite;
}
@keyframes tour-pulse{
  0%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}
  70%{box-shadow:0 0 0 8px rgba(37,99,235,0)}
  100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}
@keyframes tour-fill{from{width:0}to{width:100%}}
@keyframes tour-indeterminate{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(280%)}
}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;justify-content:center}
.theme-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
  transition:border-color .12s,color .12s;
}
.theme-btn:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.theme-btn .sun{display:none}
.tv-explore[data-theme="light"] .theme-btn .moon{display:none}
.tv-explore[data-theme="light"] .theme-btn .sun{display:block}

/* ── main stage ── */
.main{min-width:0;display:flex;flex-direction:column;min-height:0;gap:10px}
.stage{
  flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel);box-shadow:var(--shadow);
  /* Vertical page scroll OK; horizontal reserved for feature/slide swipe */
  touch-action:pan-y;
}
.stage-body{
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--media);
}
.stage-main{
  min-width:0;min-height:0;flex:1;display:flex;flex-direction:column;overflow:auto;
}
.media-heading{
  flex-shrink:0;
  padding:16px 20px 10px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.media-section{
  font-size:.68rem;font-weight:600;letter-spacing:-.01em;color:var(--dim);
  margin:0 0 4px;
}
.media-title{
  margin:0;font-size:clamp(1.15rem,1.8vw,1.4rem);font-weight:600;
  letter-spacing:-.03em;line-height:1.2;color:var(--ink);
}
.media-desc{
  margin:6px 0 0;color:var(--muted);font-size:.82rem;line-height:1.45;
}
.stage-below{
  flex-shrink:0;
  padding:14px 20px 16px;
  background:var(--panel);
  border-top:1px solid var(--line);
}
.stage-below .lead{
  margin:0 0 12px;color:var(--muted);font-size:.84rem;line-height:1.5;
}
/* Desktop default: 2 columns; narrow viewports collapse to 1 */
.highlights,
.stage-below .highlights,
.feature-card .stage-below .highlights{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px 24px;
  padding-bottom:0;
  width:100%;
}
@media(max-width:480px){
  .highlights,
  .stage-below .highlights,
  .feature-card .stage-below .highlights{
    grid-template-columns:1fr;
    gap:2px;
  }
}
.hl{
  position:relative;display:flex;align-items:flex-start;gap:10px;
  width:100%;min-width:0;max-width:100%;box-sizing:border-box;
  padding:8px 6px;border-radius:0;text-align:left;color:var(--ink);
  border:0;border-left:2px solid transparent;background:transparent;
  cursor:pointer;
  transition:color .12s,background .12s,border-color .12s;
}
.hl:hover{background:var(--panel-2)}
.hl[aria-current="true"]{
  color:var(--ink);background:transparent;
  border-left-color:var(--accent);
}
.hl[aria-current="true"] strong{color:var(--accent)}
.hl-ico{
  flex:0 0 28px;width:28px;height:28px;min-width:28px;max-width:28px;
  aspect-ratio:1;border-radius:7px;margin-top:1px;box-sizing:border-box;
  border:1px solid var(--line);background:var(--panel-2);
  display:grid;place-items:center;padding:5px;color:var(--muted);
  overflow:hidden;pointer-events:none;
}
.hl[aria-current="true"] .hl-ico{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.hl-ico svg{width:16px;height:16px;display:block;flex:none}
.hl-body{min-width:0;flex:1 1 auto;text-align:left}
.hl-body strong{display:block;font-size:.78rem;font-weight:600;margin-bottom:1px;letter-spacing:-.015em;color:inherit}
.hl-body span{display:block;font-size:.68rem;line-height:1.4;color:var(--muted)}
/* Quiet toolbar under media — content-sized, never full-bleed */
.media-ctas{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;
  gap:8px;padding:10px 16px 12px;flex-shrink:0;
  border-top:1px solid var(--line);
  background:var(--panel);
}
.media-ctas .actions{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  width:auto;max-width:100%;margin:0;padding:0;
}
.media-ctas .btn,
.media-ctas a.btn{
  display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;width:auto;max-width:100%;min-width:0;
  height:32px;padding:0 12px;box-sizing:border-box;
  border-radius:8px;border:1px solid transparent;
  font-size:.76rem;font-weight:600;letter-spacing:-.01em;
  line-height:1;white-space:nowrap;text-decoration:none;
  transition:background .12s,border-color .12s,color .12s,transform .08s;
}
.media-ctas .btn:active,
.media-ctas a.btn:active{transform:translateY(1px)}
.media-ctas .btn-primary{
  background:var(--accent);color:#fff;border-color:transparent;
}
.media-ctas .btn-primary:hover{background:var(--accent-hover);color:#fff}
.media-ctas .btn-ghost{
  background:transparent;color:var(--ink);border-color:var(--line-strong);
}
.media-ctas .btn-ghost:hover{
  border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
  color:var(--accent);background:var(--sel-bg);
}

.stage-media{
  position:relative;flex:1 1 auto;min-height:220px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  /* Allow host-page scroll/pan; only lock gestures when zoomed */
  padding:16px 20px;touch-action:pan-y pinch-zoom;user-select:none;background:var(--media);
}
.stage-media[data-zoomed]{cursor:grab;touch-action:none}
.stage-media[data-panning]{cursor:grabbing}
.media-surface{
  position:relative;flex:1;width:100%;height:100%;min-width:0;min-height:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  margin:0;box-sizing:border-box;
}
/* Zoom pans via translate3d only — never CSS scale (bilinear softens UI text) */
.media-xform{
  box-sizing:border-box;
  flex:1 1 auto;
  width:100%;height:100%;
  min-width:0;min-height:0;
  max-width:100%;max-height:100%;
  display:flex;align-items:center;justify-content:center;
  transform-origin:0 0;
  will-change:auto;
}
.stage-media img.media-el,.stage-media video.media-el{
  display:block;box-sizing:border-box;flex:none;
  /* Fit (1×): one contain shrink. Zoomed: JS sets exact px from naturalWidth. */
  width:auto;height:auto;
  max-width:100%;max-height:100%;
  object-fit:contain;object-position:center;
  border-radius:4px;
  image-rendering:auto;
  -webkit-user-drag:none;user-drag:none;
  pointer-events:auto;
}
.stage-media[data-zoomed] img.media-el,
.stage-media[data-zoomed] video.media-el{
  max-width:none;max-height:none;
}
.stage-media .empty-media{color:var(--dim);font-size:.9rem;padding:24px;text-align:center}
.zoom-badge{
  position:absolute;right:14px;bottom:14px;z-index:2;
  padding:4px 8px;border-radius:8px;font-size:.68rem;font-weight:600;
  letter-spacing:-.01em;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);opacity:0;pointer-events:none;
  transition:opacity .15s;
}
.stage-media[data-zoomed] .zoom-badge{opacity:1}

.metrics{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:10px 14px;border-top:1px solid var(--line);background:var(--panel-2);
}
.metric{
  padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);
}
.metric b{display:block;font-size:.76rem;font-weight:600;letter-spacing:-.015em;margin-bottom:2px;color:var(--ink)}
.metric span{font-size:.66rem;color:var(--muted)}

.stage-foot{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);
}
.tour-controls{
  display:flex;flex-direction:row;align-items:center;gap:10px;
  padding:5px 10px 5px 6px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);flex-shrink:0;
}
.tour-controls[data-mode="playing"]{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tour-controls[data-mode="paused"]{border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.tour-controls[data-mode="stopped"]{opacity:.92}
.tour-btns{display:flex;gap:4px;flex-shrink:0}
.tour-btn{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  transition:color .12s,border-color .12s,background .12s;
}
.tour-btn:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tour-btn[aria-pressed="true"]{
  color:#fff;background:var(--accent);border-color:transparent;
}
/* Stop must not use --ink fill (light on dark → white tile) */
.tour-btn[data-act="stop"][aria-pressed="true"]{
  color:var(--ink);
  background:var(--sel-bg);
  border-color:color-mix(in srgb,var(--accent) 28%,var(--line));
}
.tour-btn svg{width:14px;height:14px}
.tour-meta{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0}
.tour-meta b{
  font-size:.68rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);
}
.tour-controls[data-mode="playing"] .tour-meta b{color:var(--accent)}
.tour-controls[data-mode="paused"] .tour-meta b{color:var(--amber)}
.tour-meta span{font-size:.65rem;color:var(--muted);line-height:1.25;white-space:nowrap;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.slide-nav{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.slide-nav button{
  height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font-size:.76rem;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.slide-nav button:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}
.slide-nav button:disabled{opacity:.35;cursor:default}
.slide-dots{display:flex;gap:6px;align-items:center;margin:0 4px}
.slide-dots button{
  width:6px;height:6px;border-radius:50%;background:var(--dim);padding:0;opacity:.4;
  transition:background .12s,opacity .12s;
}
.slide-dots button[aria-current="true"]{
  background:var(--accent);opacity:1;
}

@media(max-width:1100px){
  .shell{grid-template-columns:200px minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
/* Stack: all features scroll; slides via buttons + horizontal swipe only */
@media(max-width:900px){
  html,.tv-explore{height:auto;overflow:auto}
  .tv-explore,.tv-explore.tv-stack{
    height:auto!important;min-height:0!important;overflow:visible!important;
  }

  .shell{
    display:flex;flex-direction:column;
    height:auto;min-height:0;overflow:visible;
    gap:8px;
    padding:8px;
    padding-left:max(8px,env(safe-area-inset-left));
    padding-right:max(8px,env(safe-area-inset-right));
    padding-bottom:max(12px,env(safe-area-inset-bottom));
  }

  /* Compact brand bar */
  .sidebar{
    width:100%;max-height:none;
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:"brand foot";
    align-items:center;
    border-radius:10px;
  }
  .side-brand{grid-area:brand;padding:10px 6px 10px 12px;gap:10px}
  .side-brand strong{font-size:.82rem;font-weight:600;letter-spacing:-.02em}
  .side-logo{width:28px;height:28px;padding:5px;border-radius:7px}
  .side-foot{
    grid-area:foot;border-top:0;padding:8px 10px;
    justify-content:flex-end;
  }
  .theme-btn{width:36px;height:36px;border-radius:9px}
  .side-nav{display:none!important}

  .main,.stage{overflow:visible;min-height:0;flex:none;height:auto}
  .stage.is-stack{
    background:transparent;border:0;box-shadow:none;
    overflow:visible;touch-action:pan-y;
  }

  /* Solid sticky tour chrome — no gradient wash */
  .stack-tour{
    position:sticky;top:0;z-index:5;
    margin:0 0 8px;
    padding:0;
    background:var(--bg);
    padding-top:env(safe-area-inset-top,0);
  }
  .stack-tour .tour-controls{
    width:100%;
    padding:8px 10px;gap:10px;
    border-radius:10px;
    background:var(--panel);
    box-shadow:var(--shadow);
  }
  .stack-tour .tour-btn{width:40px;height:40px;border-radius:9px}
  .stack-tour .tour-btn svg{width:16px;height:16px}
  .stack-tour .tour-meta b{font-size:.72rem}
  .stack-tour .tour-meta span{white-space:normal;max-width:none;font-size:.68rem}

  .feature-stack{display:flex;flex-direction:column;gap:10px}
  .feature-card{
    border-radius:10px;border:1px solid var(--line);
    background:var(--panel);box-shadow:none;
    overflow:hidden;touch-action:pan-y;
  }
  .feature-card[aria-current="true"]{
    border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
  }
  .feature-cat{
    padding:8px 14px 0;
    font-size:.7rem;font-weight:600;letter-spacing:-.01em;color:var(--dim);
  }

  .feature-card .stage-body,
  .feature-card .stage-main{
    display:flex;flex-direction:column;
    min-height:0;overflow:visible;flex:none;
    background:var(--media);
  }
  .feature-card .media-heading{
    padding:12px 14px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .feature-card .media-title{font-size:1.05rem;letter-spacing:-.025em}
  .feature-card .media-desc{font-size:.74rem}
  .feature-card .stage-media{
    flex:none;
    min-height:min(52vw,280px);
    max-height:min(62vh,420px);
    padding:8px;
    touch-action:pan-y pinch-zoom;
    background:var(--media);
  }
  .feature-card .media-ctas{
    padding:10px 14px;justify-content:flex-start;gap:8px;
    border-top:1px solid var(--line);background:var(--panel);
  }
  .feature-card .media-ctas .actions{width:auto;max-width:100%}
  .feature-card .media-ctas .btn,
  .feature-card .media-ctas a.btn{
    height:36px;padding:0 14px;font-size:.78rem;border-radius:8px;
    flex:0 0 auto;width:auto!important;max-width:100%;
  }
  .feature-card .stage-below{
    padding:12px 14px 10px;
    border-top:1px solid var(--line);background:var(--panel);
  }

/* Lightbox — full-bleed overlay (themed light/dark).
   Appended to document.body (outside .tv-explore) — must carry its own type + tokens. */
html.tv-lb-open,html.tv-lb-open .tv-explore{overflow:hidden!important}
.tv-lightbox{
  --tv-bg-light:#F7F6F5;
  --tv-bg-dark:#282828;
  --lb-scrim:color-mix(in srgb,var(--tv-bg-dark) 92%,transparent);
  --lb-card:rgba(31,31,31,.82);
  --lb-line:rgba(148,163,184,.22);
  --lb-ink:#e8eef8;
  --lb-muted:#8b9bb3;
  --lb-dim:rgba(232,238,248,.55);
  --lb-btn:rgba(31,31,31,.82);
  --lb-btn-hover:rgba(40,40,40,.94);
  --lb-shadow:0 10px 32px rgba(0,0,0,.35);
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.22); --amber:#fbbf24;
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--lb-scrim);color:var(--lb-ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:13.5px;line-height:1.45;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}
.tv-lightbox button,
.tv-lightbox input,
.tv-lightbox a{
  font:inherit;color:inherit;letter-spacing:inherit;
}
.tv-lightbox[data-theme="light"]{
  --lb-scrim:color-mix(in srgb,var(--tv-bg-light) 94%,transparent);
  --lb-card:rgba(255,255,255,.92);
  --lb-line:rgba(15,23,42,.12);
  --lb-ink:#0f172a;
  --lb-muted:#64748b;
  --lb-dim:rgba(15,23,42,.48);
  --lb-btn:rgba(255,255,255,.92);
  --lb-btn-hover:#fff;
  --lb-shadow:0 10px 32px rgba(15,23,42,.14);
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.14); --amber:#d97706;
}
.tv-lightbox[hidden]{display:none!important}
.tv-lb-stage{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;
  min-width:0;min-height:0;overflow:hidden;
}
.tv-lb-media{
  position:relative;flex:1 1 auto;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:48px 48px 24px;
  overflow:hidden;touch-action:none;user-select:none;
}
.tv-lb-xform{
  box-sizing:border-box;
  flex:1 1 auto;
  width:100%;height:100%;
  min-width:0;min-height:0;
  max-width:100%;max-height:100%;
  display:flex;align-items:center;justify-content:center;
  transform-origin:0 0;
  will-change:auto;
}
.tv-lb-media[data-zoomed]{cursor:grab}
.tv-lightbox img.tv-lb-el,
.tv-lightbox video.tv-lb-el{
  display:block;box-sizing:border-box;flex:none;
  width:auto;height:auto;
  max-width:100%;max-height:100%;
  object-fit:contain;object-position:center;
  border-radius:4px;pointer-events:auto;
  image-rendering:auto;
  -webkit-user-drag:none;user-drag:none;
}
.tv-lb-media[data-zoomed] img.tv-lb-el,
.tv-lb-media[data-zoomed] video.tv-lb-el{
  max-width:none;max-height:none;
}
.tv-lb-badge{
  position:absolute;right:24px;bottom:20px;z-index:2;
  padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;
  color:var(--lb-ink);background:var(--lb-card);border:1px solid var(--lb-line);
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.tv-lb-footer{
  position:relative;z-index:4;flex:0 0 auto;
  display:flex;align-items:stretch;justify-content:center;gap:12px;
  padding:8px 24px 28px;
  pointer-events:none;
}
.tv-lb-caption-row{
  display:flex;align-items:stretch;gap:8px;
  flex:1 1 auto;min-width:0;max-width:640px;
  pointer-events:auto;
}
.tv-lb-card{
  height:56px;
  border-radius:12px;
  border:1px solid var(--lb-line);
  background:var(--lb-card);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--lb-shadow);
  color:var(--lb-ink);
  box-sizing:border-box;
}
.tv-lb-caption{
  flex:1 1 auto;min-width:0;
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;
  align-content:center;column-gap:12px;row-gap:1px;
  padding:8px 16px;text-align:left;pointer-events:none;
  overflow:hidden;
}
.tv-lb-title{
  grid-column:1;grid-row:1;
  margin:0;font-family:inherit;
  font-size:.95rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;
  color:var(--lb-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tv-lb-count{
  grid-column:2;grid-row:1;align-self:center;
  font-family:inherit;
  font-size:.68rem;font-weight:600;letter-spacing:-.01em;line-height:1.2;
  text-transform:none;color:var(--lb-dim);
  white-space:nowrap;
}
.tv-lb-desc{
  grid-column:1/-1;grid-row:2;
  margin:0;font-family:inherit;
  font-size:.8rem;line-height:1.3;color:var(--lb-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tv-lb-close{
  position:absolute;z-index:5;top:16px;right:16px;
  width:48px;height:48px;font-size:1.75rem;line-height:1;
  display:grid;place-items:center;
  border:1px solid var(--lb-line);border-radius:12px;cursor:pointer;
  color:var(--lb-ink);background:var(--lb-btn);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .15s;
}
.tv-lb-close:hover{background:var(--lb-btn-hover)}
.tv-lb-prev,.tv-lb-next{
  flex:0 0 56px;width:56px;padding:0;
  display:grid;place-items:center;
  font-size:1.85rem;line-height:1;cursor:pointer;
  color:var(--lb-ink);background:var(--lb-card);
  transition:background .15s,opacity .15s;
  pointer-events:auto;
}
.tv-lb-prev:hover,.tv-lb-next:hover{background:var(--lb-btn-hover)}
.tv-lb-prev[hidden],.tv-lb-next[hidden]{display:none!important}
.tv-lb-tour{
  flex:0 0 auto;pointer-events:auto;
  display:flex;align-items:stretch;
}
.tv-lightbox .tour-controls{
  border:0;box-shadow:none;background:transparent;
  height:100%;padding:8px 12px;gap:10px;border-radius:0;
  opacity:1;
}
.tv-lightbox .tour-btn{
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--lb-line);
  background:color-mix(in srgb,var(--lb-ink) 6%,transparent);
  color:var(--lb-muted);
}
.tv-lightbox .tour-btn:hover{
  color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 40%,var(--lb-line));
  background:color-mix(in srgb,var(--accent) 10%,transparent);
}
.tv-lightbox .tour-btn[aria-pressed="true"]{
  color:#fff;background:var(--accent);border-color:transparent;
}
.tv-lightbox .tour-btn[data-act="stop"][aria-pressed="true"]{
  color:var(--lb-ink);
  background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 35%,var(--lb-line));
}
.tv-lightbox .tour-meta b{
  font-family:inherit;font-size:.72rem;font-weight:600;letter-spacing:-.01em;
  color:var(--lb-ink);
}
.tv-lightbox .tour-controls[data-mode="playing"] .tour-meta b{color:var(--accent)}
.tv-lightbox .tour-controls[data-mode="paused"] .tour-meta b{color:var(--amber)}
.tv-lightbox .tour-meta span{
  font-family:inherit;max-width:22ch;color:var(--lb-muted);
}
@media(max-width:900px){
  .tv-lb-media{
    padding:max(52px,calc(12px + env(safe-area-inset-top))) 12px 12px;
  }
  .tv-lb-footer{
    flex-direction:column-reverse;align-items:stretch;gap:8px;
    padding:6px 12px max(14px,env(safe-area-inset-bottom));
  }
  .tv-lb-caption-row{max-width:none;width:100%}
  .tv-lb-card{height:52px;border-radius:10px}
  .tv-lb-caption{padding:7px 12px}
  .tv-lb-title{font-size:.9rem;font-weight:600}
  .tv-lb-desc{font-size:.76rem}
  .tv-lb-count{font-size:.64rem;letter-spacing:.02em;text-transform:none}
  .tv-lb-prev,.tv-lb-next{flex-basis:48px;width:48px;font-size:1.6rem}
  .tv-lb-close{
    top:max(10px,env(safe-area-inset-top));
    right:max(10px,env(safe-area-inset-right));
    width:44px;height:44px;border-radius:10px;font-size:1.5rem;
  }
  .tv-lb-badge{right:14px;bottom:14px;border-radius:8px}
  .tv-lb-tour{width:100%}
  .tv-lightbox .tour-controls{width:100%;padding:6px 10px}
  .tv-lightbox .tour-meta span{max-width:none;white-space:normal}
}

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var ICONS = JSON.parse(document.getElementById('icons').textContent);
  var product = DATA.product;
  var features = DATA.features;
  var selected = 0;
  /** Per-feature slide index (stack mode keeps each card independent). */
  var slideByFeat = {};
  var IMAGE_MS = 4000;
  var IDLE_MS = 2000;
  var TOUR_KEY = 'tv-explore-tour';
  /**
   * Zoom by CSS pixel width on the <img> (not CSS scale, not % ladders).
   * zoomW === 0 → fit (max-width/height contain). Wheel step = ZOOM_STEP_PX.
   */
  var ZOOM_STEP_PX = 30;
  var ZOOM_MAX_FACTOR = 8;
  function zoomMediaEl(root) {
    return root ? root.querySelector('img.media-el, video.media-el, img.tv-lb-el, video.tv-lb-el') : null;
  }
  function mediaNaturalSize(el) {
    if (!el) return { w: 0, h: 0 };
    if (el.tagName === 'VIDEO') return { w: el.videoWidth || 0, h: el.videoHeight || 0 };
    return { w: el.naturalWidth || 0, h: el.naturalHeight || 0 };
  }
  function zoomMaxW(natW) {
    return Math.round(Math.max(0, natW) * ZOOM_MAX_FACTOR);
  }
  /** Display width → badge percent vs natural (fit shows actual scale). */
  function zoomBadgeText(el, zoomW) {
    var nat = mediaNaturalSize(el);
    if (!nat.w) return '100%';
    var w = zoomW > 0 ? zoomW : (el && el.offsetWidth) || 0;
    if (!w) return '100%';
    return Math.round((w * 100) / nat.w) + '%';
  }
  /**
   * Step display width by ±ZOOM_STEP_PX.
   * @returns {{ zoomW: number, fitW: number }}
   */
  function stepZoomW(el, zoomW, fitW, direction) {
    var nat = mediaNaturalSize(el);
    var cur = zoomW > 0 ? zoomW : (el && el.offsetWidth) || 0;
    var fit = fitW > 0 ? fitW : cur;
    if (!(cur > 0)) return { zoomW: zoomW, fitW: fit };
    var next = cur + direction * ZOOM_STEP_PX;
    var maxW = zoomMaxW(nat.w);
    if (next <= fit) return { zoomW: 0, fitW: fit };
    return { zoomW: Math.min(maxW, next), fitW: fit };
  }
  /** Snap width onto fitW + n×ZOOM_STEP_PX grid (pinch end). */
  function snapZoomW(w, fitW, maxW) {
    var fit = fitW > 0 ? fitW : 0;
    if (!(w > fit)) return 0;
    var n = Math.round((w - fit) / ZOOM_STEP_PX);
    var snapped = fit + n * ZOOM_STEP_PX;
    if (snapped <= fit) return 0;
    return Math.min(maxW > 0 ? maxW : snapped, snapped);
  }
  function panAfterZoomW(p, prevW, nextW, fitW) {
    if (!(nextW > 0)) return { x: 0, y: 0 };
    if (!(prevW > 0) || nextW >= prevW) return p;
    var base = fitW > 0 ? fitW : 0;
    var denom = prevW - base;
    if (!(denom > 0)) return { x: 0, y: 0 };
    var t = (nextW - base) / denom;
    return { x: p.x * t, y: p.y * t };
  }
  /**
   * Zoom by resizing the media element (not CSS scale).
   * Fit (zoomW≤0): clear inline size → CSS contain.
   * Zoomed: exact CSS px width; height:auto; pan via translate3d only.
   */
  function applyMediaZoom(xform, zoomW, pan, onNeedsLoad) {
    var el = zoomMediaEl(xform);
    if (!(zoomW > 0)) {
      xform.style.transform = '';
      if (el) {
        el.style.width = '';
        el.style.height = '';
        el.style.maxWidth = '';
        el.style.maxHeight = '';
      }
      return;
    }
    if (el) {
      var size = mediaNaturalSize(el);
      if (size.w > 0 && size.h > 0) {
        el.style.maxWidth = 'none';
        el.style.maxHeight = 'none';
        el.style.width = Math.round(zoomW) + 'px';
        el.style.height = 'auto';
      } else if (typeof onNeedsLoad === 'function') {
        onNeedsLoad(el);
      }
    }
    xform.style.transform =
      'translate3d(' + Math.round(pan.x) + 'px,' + Math.round(pan.y) + 'px,0)';
  }
  /** Hard stop only is persisted; soft pause does not survive reload. */
  function readTourMode() {
    try {
      if (localStorage.getItem(TOUR_KEY) === 'stopped') return 'stopped';
    } catch (_) {}
    return 'playing';
  }
  function persistTourMode(mode) {
    try {
      if (mode === 'stopped') localStorage.setItem(TOUR_KEY, 'stopped');
      else if (mode === 'playing') localStorage.removeItem(TOUR_KEY);
    } catch (_) {}
  }
  var tourMode = readTourMode(); // playing | paused | stopped
  var tourGen = 0;
  var tourTimer = null;
  var idleTimer = null;
  var suppressIdle = false;

  var elBrandLogo = document.getElementById('brandLogo');
  var elBrandTitle = document.getElementById('brandTitle');
  var elNav = document.getElementById('sideNav');
  var elStage = document.getElementById('stage');
  var themeBtn = document.getElementById('themeBtn');
  elBrandTitle.textContent = product.title || 'Tanit Viewer';
  elBrandLogo.innerHTML = ICONS.avatar || '';

  function setTourHints(text) {
    document.querySelectorAll('.tour-hint').forEach(function (el) { el.textContent = text; });
  }

  /** Optional CDN/base from build: window.TV_ASSET_URL (e.g. https://cdn.example.com/tanit/) */
  function assetUrl(path) {
    if (!path) return path;
    if (/^(https?:|data:|blob:|\/\/)/i.test(path)) return path;
    var base = typeof TV_ASSET_URL === 'string' ? TV_ASSET_URL : '';
    if (!base) return path;
    return base.replace(/\/?$/, '/') + String(path).replace(/^\.\//, '').replace(/^\//, '');
  }

  var clickSfxPool = [];
  var clickSfxIdx = 0;
  function playClick() {
    try {
      if (!clickSfxPool.length) {
        for (var i = 0; i < 4; i++) {
          var a = new Audio(assetUrl('sfx/selected.mp3'));
          a.preload = 'auto';
          a.volume = 0.55;
          clickSfxPool.push(a);

        var startW = lb.zoomW > 0 ? lb.zoomW : (mediaEl && mediaEl.offsetWidth) || 0;
        if (!(lb.fitW > 0) && startW > 0) lb.fitW = startW;
        lb.pinch = {
          distance: Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)),
          zoomW: startW,
          fitW: lb.fitW,
        };
        try { media.setPointerCapture(e.pointerId); } catch (_) {}
        return;
      }
      lb.drag = {
        id: e.pointerId, x: e.clientX, y: e.clientY,
        panX: lb.pan.x, panY: lb.pan.y, moved: false, t: Date.now(),
      };
      if (lb.zoomW > 0) {
        try { media.setPointerCapture(e.pointerId); } catch (_) {}
      }
    });
    media.addEventListener('pointermove', function (e) {
      if (!lb.pointers.has(e.pointerId)) return;
      lb.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (lb.pointers.size >= 2 && lb.pinch) {
        var pts = Array.from(lb.pointers.values());
        var distance = Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
        lightboxSetZoomW(lb.pinch.zoomW * (distance / lb.pinch.distance), true);
        return;
      }
      if (!lb.drag || lb.drag.id !== e.pointerId) return;
      var dx = e.clientX - lb.drag.x;
      var dy = e.clientY - lb.drag.y;
      if (!lb.drag.moved && Math.hypot(dx, dy) < 4) return;
      lb.drag.moved = true;
      if (lb.zoomW > 0) {
        lb.pan = { x: lb.drag.panX + dx, y: lb.drag.panY + dy };
        lightboxApplyTransform();
      }
    });
    function lbEnd(e) {
      if (!lb.pointers.has(e.pointerId)) return;
      var drag = lb.drag && lb.drag.id === e.pointerId ? lb.drag : null;
      lb.pointers.delete(e.pointerId);
      if (lb.pointers.size < 2 && lb.pinch) {
        lightboxSetZoomW(lb.zoomW, false); // snap to ±30px grid
        lb.pinch = null;
      }
      if (drag && !(lb.zoomW > 0)) {
        var sdx = e.clientX - drag.x;
        var sdy = e.clientY - drag.y;
        if (drag.moved && Math.abs(sdx) > 50 && Math.abs(sdy) < 100) {
          lightboxNav(sdx < 0 ? 1 : -1);
        } else if (!drag.moved && Date.now() - drag.t < 400) {
          lightboxNav(1); // click → next (ImageLightbox-style)
        }
      }
      if (lb.drag && lb.drag.id === e.pointerId) lb.drag = null;
    }
    media.addEventListener('pointerup', lbEnd);
    media.addEventListener('pointercancel', function (e) {
      lb.pointers.delete(e.pointerId);
      lb.drag = null;
      lb.pinch = null;
    });
    media.addEventListener('dblclick', function () {
      if (lb.zoomW > 0) {
        lb.zoomW = 0;
        lb.pan = { x: 0, y: 0 };
        lightboxApplyTransform();
      } else {
        // Jump toward ~2× natural width
        var xform = el.querySelector('.tv-lb-xform');
        var mediaEl = zoomMediaEl(xform);
        var nat = mediaNaturalSize(mediaEl);
        if (!(lb.fitW > 0) && mediaEl) lb.fitW = mediaEl.offsetWidth || 0;
        lightboxSetZoomW(nat.w * 2, false);
      }
    });

    return el;
  }

  /** @param {number} w CSS px width  @param {boolean} [live] continuous pinch — skip 30px snap */
  function lightboxSetZoomW(w, live) {
    var xform = lb.el && lb.el.querySelector('.tv-lb-xform');
    var el = zoomMediaEl(xform);
    var nat = mediaNaturalSize(el);
    var prev = lb.zoomW > 0 ? lb.zoomW : (el && el.offsetWidth) || 0;
    var maxW = zoomMaxW(nat.w);
    var fit = lb.fitW > 0 ? lb.fitW : (el && el.offsetWidth) || 0;
    if (!(lb.fitW > 0) && fit > 0) lb.fitW = fit;
    var next = Math.round(Number(w) || 0);
    if (!live) next = snapZoomW(next, lb.fitW, maxW);
    else {
      next = Math.min(maxW, Math.max(0, next));
      if (next <= lb.fitW) next = 0;
    }
    lb.zoomW = next;
    if (!(lb.zoomW > 0)) { lb.zoomW = 0; lb.pan = { x: 0, y: 0 }; }
    else lb.pan = panAfterZoomW(lb.pan, prev, lb.zoomW, lb.fitW);
    lightboxApplyTransform();
  }
  function lightboxZoomBy(direction) {
    var xform = lb.el && lb.el.querySelector('.tv-lb-xform');
    var el = zoomMediaEl(xform);
    var prev = lb.zoomW > 0 ? lb.zoomW : (el && el.offsetWidth) || 0;
    var stepped = stepZoomW(el, lb.zoomW, lb.fitW, direction);
    if (stepped.zoomW === lb.zoomW && lb.zoomW > 0) return;
    if (!(stepped.zoomW > 0) && !(lb.zoomW > 0)) return;
    lb.fitW = stepped.fitW;
    lb.zoomW = stepped.zoomW;
    lb.pan = panAfterZoomW(lb.pan, prev, lb.zoomW, lb.fitW);
    lightboxApplyTransform();
  }
  function lightboxApplyTransform() {
    if (!lb.el) return;
    var xform = lb.el.querySelector('.tv-lb-xform');
    var badge = lb.el.querySelector('.tv-lb-badge');
    var media = lb.el.querySelector('.tv-lb-media');
    if (xform) {
      applyMediaZoom(xform, lb.zoomW, lb.pan, function (el) {
        if (el._tvZoomWait) return;
        el._tvZoomWait = true;
        var retry = function () { el._tvZoomWait = false; lightboxApplyTransform(); };
        el.addEventListener('load', retry, { once: true });
        el.addEventListener('loadeddata', retry, { once: true });
      });
    }
    if (badge) {
      badge.textContent = zoomBadgeText(zoomMediaEl(xform), lb.zoomW);
      badge.style.opacity = lb.zoomW > 0 ? '1' : '0';
    }
    if (media) {
      if (lb.zoomW > 0) media.setAttribute('data-zoomed', '');
      else media.removeAttribute('data-zoomed');
    }
  }

  function lightboxNav(dir) {
    if (!lb.open) return;
    // Same wrapping as desktop stepSlide — update stage first, then lightbox media.
    var fi = lb.fi;
    var list = slidesOf(fi);
    var next = slideIndex(fi) + dir;
    if (next >= 0 && next < list.length) {
      setSlideIndex(fi, next);
      selected = fi;
      lb.fi = fi;
      syncTourUi();
      if (isStackMode()) refreshFeatureCard(fi);
      else { renderNav(); renderStage(); }
      renderLightboxContent();
      if (tourMode === 'playing') scheduleAdvance();
      return;
    }
    var visible = visibleFeatures();
    if (!visible.length) return;
    var vi = visible.indexOf(features[fi] || feat());
    if (vi < 0) vi = 0;
    var ni = (vi + dir + visible.length) % visible.length;
    var nfi = features.indexOf(visible[ni]);
    var nSlides = slidesOf(nfi).length;
    setSlideIndex(nfi, dir < 0 ? Math.max(0, nSlides - 1) : 0);
    selected = nfi;
    lb.fi = nfi;
    syncTourUi();
    if (isStackMode()) { refreshFeatureCard(nfi); scrollSelectedCard(true); }
    else paint();
    renderLightboxContent();
    if (tourMode === 'playing') scheduleAdvance();
  }

  /** Stage may have advanced past catalog[0] via theme fallback — lightbox must follow. */
  function stageMediaEl(fi) {
    if (!elStage) return null;
    if (isStackMode()) {
      var card = elStage.querySelector('.feature-card[data-feat="' + fi + '"]');
      return card ? card.querySelector('.media-el') : null;
    }
    if (fi === selected) return elStage.querySelector('.stage-media .media-el');
    return null;
  }

  function pickLightboxMedia(m, fi) {
    var cands = m ? mediaCandidates(m) : [];
    var startI = 0;
    var src = '';
    // Reuse stage asset only when it belongs to THIS slide's candidates.
    // (lightboxNav used to render before the stage refreshed → sticky previous media.)
    var stageEl = stageMediaEl(fi);
    if (stageEl && cands.length) {
      var stageSrc = stageEl.currentSrc || stageEl.getAttribute('src') || '';
      var leaf = stageSrc.split('?')[0].split('/').pop();
      if (leaf) {
        for (var j = 0; j < cands.length; j++) {
          if ((cands[j].split('?')[0].split('/').pop()) === leaf) {
            startI = j;
            src = cands[j];
            break;
          }
        }
      }
    }
    if (!src && cands.length) {
      src = cands[0];
      startI = 0;
    }
    return { cands: cands, src: src, startI: startI };
  }

  /** Keep lightbox + stage on the same feature/slide. */
  function syncLightboxFromState() {
    if (!lb.open) return;
    lb.fi = selected;
    renderLightboxContent();
  }

  function renderLightboxContent() {
    ensureLightbox();
    var fi = lb.fi;
    var f = features[fi];
    var s = slideOf(fi);
    var list = slidesOf(fi);
    var si = slideIndex(fi);
    var xform = lb.el.querySelector('.tv-lb-xform');
    var title = lb.el.querySelector('.tv-lb-title');
    var desc = lb.el.querySelector('.tv-lb-desc');
    var count = lb.el.querySelector('.tv-lb-count');
    var prev = lb.el.querySelector('.tv-lb-prev');
    var next = lb.el.querySelector('.tv-lb-next');
    if (!f || !s || !xform) return;

    var m = s.media || {};
    var pick = pickLightboxMedia(m, fi);
    var src = pick.src;
    var isVid = src && (isVideoSrc(src) || m.type === 'video');
    var data = esc(JSON.stringify(pick.cands));
    var di = String(pick.startI || 0);
    if (isVid) {
      xform.innerHTML = '<video class="media-el tv-lb-el" data-fallback="' + data + '" data-i="' + di + '" src="' + esc(src) + '" controls playsinline autoplay preload="auto"></video>';
    } else if (src) {
      xform.innerHTML = '<img class="media-el tv-lb-el" data-fallback="' + data + '" data-i="' + di + '" src="' + esc(src) + '" alt="" draggable="false" decoding="async"/>';
    } else {
      xform.innerHTML = '<div class="empty-media">No media</div>';
    }
    bindMediaFallback(xform);

    var t = s.title || f.label || '';
    var d = s.description || f.description || '';
    title.textContent = t;
    desc.textContent = d;
    desc.hidden = !d;
    count.textContent = (si + 1) + ' / ' + Math.max(1, list.length) + (f.label ? ' · ' + f.label : '');

    var vis = visibleFeatures();
    var canNav = list.length > 1 || vis.length > 1;
    prev.hidden = !canNav;
    next.hidden = !canNav;

    lb.zoomW = 0;
    lb.fitW = 0;
    lb.pan = { x: 0, y: 0 };
    lightboxApplyTransform();
    syncTourUi();
    syncLightboxPlayback();
  }

  function syncLightboxPlayback() {
    if (!lb.open || !lb.el) return;
    var vid = lb.el.querySelector('video.tv-lb-el');
    if (!vid) return;
    if (tourMode === 'playing') {
      vid.muted = true;
      var p = vid.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      try { vid.pause(); } catch (_) {}
    }
  }

  function openLightbox(fi) {
    if (fi == null || isNaN(fi)) fi = selected;
    lb.fi = fi;
    selected = fi;
    ensureLightbox();
    lb.el.setAttribute('data-theme', themeName());
    lb.open = true;
    lb.el.hidden = false;
    document.documentElement.classList.add('tv-lb-open');
    renderLightboxContent();
    syncTourUi();
    if (tourMode === 'playing') scheduleAdvance();
    playClick();
  }

  function closeLightbox() {
    if (!lb.open) return;
    lb.open = false;
    if (lb.el) lb.el.hidden = true;
    document.documentElement.classList.remove('tv-lb-open');
    lb.pointers && lb.pointers.clear();
    lb.drag = null;
    lb.pinch = null;
    syncTourUi();
    if (tourMode === 'playing') scheduleAdvance();
    else syncMediaPlayback();
  }

  function resolveThumbSlide(list, h, i) {
    if (typeof h.slide === 'number' && !isNaN(h.slide)) {
      return Math.max(0, Math.min(list.length - 1, h.slide));
    }
    if (h.slide != null && h.slide !== '') {
      var byId = list.findIndex(function (sl) { return sl.id === h.slide; });
      if (byId >= 0) return byId;
    }
    if (list.length <= 1) return 0;
    return Math.min(i, list.length - 1);
  }

  function featureBodyHtml(f, fi, opts) {
    opts = opts || {};
    var stack = !!opts.stack;
    var list = slidesOf(fi);
    var si = slideIndex(fi);
    var s = list[si] || list[0];
    if (!s) {
      return '<div class="stage-below"><p class="lead">No slides</p></div>';
    }
    var acts = s.actions || [];
    var catalogHl = list[0] && list[0].highlights;
    var thumbSource = (catalogHl && catalogHl.length)
      ? catalogHl.filter(isEnabled)
      : list.map(function (sl) {
          return { title: sl.title || f.label, text: sl.description || '', icon: f.icon, slide: sl.id };
        });
    var hl = thumbSource.map(function (h, i) {
      var target = resolveThumbSlide(list, h, i);
      var on = target === si;
      return '<button type="button" class="hl" data-feat="' + fi + '" data-slide="' + target + '" aria-current="' + (on ? 'true' : 'false') + '">' +
        '<span class="hl-ico" aria-hidden="true">' + icon(h.icon || f.icon) + '</span>' +
        '<span class="hl-body">' +
          '<strong>' + esc(h.title || '') + '</strong>' +
          (h.text ? '<span>' + esc(h.text) + '</span>' : '') +
        '</span></button>';
    }).join('');
    var btns = acts.map(function (a) {
      var cls = a.primary ? 'btn btn-primary' : 'btn btn-ghost';
      var href = a.href || '#';
      return '<a class="' + cls + '" href="' + esc(href) + '">' + esc(a.label || 'Action') + '</a>';
    }).join('');
    var slideTitle = s.title || '';
    var slideDesc = s.description || '';
    var mediaHeading = (f.label || slideTitle || slideDesc)
      ? '<div class="media-heading">' +
          (f.label ? '<div class="media-section">' + esc(f.label) + '</div>' : '') +
          (slideTitle ? '<h2 class="media-title">' + esc(slideTitle) + '</h2>' : '') +
          (slideDesc ? '<p class="media-desc">' + esc(slideDesc) + '</p>' : '') +
        '</div>'
      : '';
    var below = (f.description || hl)
      ? '<div class="stage-below">' +
          (f.description ? '<p class="lead">' + esc(f.description) + '</p>' : '') +
          (hl ? '<div class="highlights">' + hl + '</div>' : '') +
        '</div>'
      : '';
    var metrics = s.metrics || f.metrics || [];
    var metricsHtml = metrics.length
      ? '<div class="metrics">' + metrics.map(function (m) {
          return '<div class="metric"><b>' + esc(m.title || m.label || '') + '</b><span>' + esc(m.text || m.description || '') + '</span></div>';
        }).join('') + '</div>'
      : '';
    var prevLabel = stack ? '← Prev' : '← Previous';
    var nextLabel = 'Next →';
    var dots = list.length > 1
      ? '<div class="slide-dots">' + list.map(function (_, i) {
          return '<button type="button" data-feat="' + fi + '" data-slide="' + i + '" aria-current="' + (i === si ? 'true' : 'false') + '" aria-label="Slide ' + (i + 1) + '"></button>';
        }).join('') + '</div>'
      : '';
    var nav =
      '<div class="slide-nav">' +
        '<button type="button" data-feat-step="-1" data-feat="' + fi + '"' + (si <= 0 ? ' disabled' : '') + '>' + prevLabel + '</button>' +
        dots +
        '<button type="button" data-feat-step="1" data-feat="' + fi + '"' + (si >= list.length - 1 ? ' disabled' : '') + '>' + nextLabel + '</button>' +
      '</div>';
    var foot =
      '<div class="stage-foot">' +
        (stack ? '' : tourControlsHtml()) +
        nav +
      '</div>';
    return (
      '<div class="stage-body">' +
        '<div class="stage-main">' +
          mediaHeading +
          '<div class="stage-media">' + mediaHtml(s.media) + '</div>' +
          (btns ? '<div class="media-ctas"><div class="actions">' + btns + '</div></div>' : '') +
          below +
          metricsHtml +
        '</div>' +
      '</div>' +
      foot
    );
  }

  function renderStage() {
    var f = feat();
    if (!f) {
      elStage.innerHTML = '<div class="stage-below"><p class="lead">Select a feature</p></div>';
      return;
    }
    elStage.classList.remove('is-stack');
    elStage.innerHTML = featureBodyHtml(f, selected, { stack: false });
    syncTourUi();
    bindMediaFallback(elStage);
    bindLazyMedia(elStage);
    bindMediaZoom(elStage);
    if (tourMode === 'playing') scheduleAdvance();
    else syncMediaPlayback();
  }

  /** All visible features as scrollable cards; slides via buttons/swipe only. */
  function renderStack() {
    var visible = visibleFeatures();
    elStage.classList.add('is-stack');
    if (!visible.length) {
      elStage.innerHTML = '<div class="stack-empty"><p class="lead">No matches</p></div>';
      return;
    }
    var cards = visible.map(function (f) {
      var fi = features.indexOf(f);
      var cat = f.categoryLabel ? '<div class="feature-cat">' + esc(f.categoryLabel) + '</div>' : '';
      return (
        '<article class="feature-card" data-feat="' + fi + '" id="feature-' + fi + '">' +
          cat +
          featureBodyHtml(f, fi, { stack: true }) +
        '</article>'
      );
    }).join('');
    elStage.innerHTML =
      '<div class="stack-tour">' + tourControlsHtml() + '</div>' +
      '<div class="feature-stack">' + cards + '</div>';
    syncTourUi();
    elStage.querySelectorAll('.feature-card').forEach(function (card) {
      bindMediaFallback(card);
      bindLazyMedia(card);
      bindMediaZoom(card);
    });
    syncStackSelection();
    syncMediaPlayback();
    if (tourMode === 'playing') scheduleAdvance();
    scrollSelectedCard(false);
  }

  function syncStackSelection() {
    if (!isStackMode()) return;
    elStage.querySelectorAll('.feature-card').forEach(function (card) {
      var fi = Number(card.getAttribute('data-feat'));
      card.setAttribute('aria-current', fi === selected ? 'true' : 'false');
    });
  }

  function scrollSelectedCard(smooth) {
    if (!isStackMode()) return;
    syncStackSelection();
    var card = elStage.querySelector('.feature-card[data-feat="' + selected + '"]');
    if (!card) return;
    try {
      card.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'nearest' });
    } catch (e) {
      card.scrollIntoView(true);
    }
  }

  /** Patch one stack card after a slide change (keeps scroll position). */
  function refreshFeatureCard(fi) {
    var card = elStage.querySelector('.feature-card[data-feat="' + fi + '"]');
    var f = features[fi];
    if (!card || !f) return;
    var cat = f.categoryLabel ? '<div class="feature-cat">' + esc(f.categoryLabel) + '</div>' : '';
    card.innerHTML = cat + featureBodyHtml(f, fi, { stack: true });
    bindMediaFallback(card);
    bindLazyMedia(card);
    bindMediaZoom(card);
    if (fi === selected) syncMediaPlayback();
    reportHeightSoon();
  }

  function syncMediaPlayback() {
    // Pause all videos; play selected feature's video when touring
    elStage.querySelectorAll('video.media-el').forEach(function (vid) {
      var card = vid.closest('.feature-card');
      var fi = card ? Number(card.getAttribute('data-feat')) : selected;
      var active = fi === selected;
      if (tourMode === 'playing' && active) {
        hydrateMedia(vid);
        vid.muted = true;
        var p = vid.play();
        if (p && p.catch) p.catch(function () {});
      } else if (active) {
        hydrateMedia(vid);
      } else {
        try { vid.pause(); } catch (_) {}
      }
    });
  }

  function advanceTour() {
    if (tourMode !== 'playing') return;
    var list = slides();
    var si = slideIndex(selected);
    if (si < list.length - 1) {
      setSlideIndex(selected, si + 1);
      if (isStackMode()) refreshFeatureCard(selected);
      else if (!lb.open) paint();
      else { renderNav(); renderStage(); }
      syncLightboxFromState();
      if (tourMode === 'playing') scheduleAdvance();
      return;
    }
    var visible = visibleFeatures();
    if (!visible.length) return;
    var cur = feat();
    var vi = visible.indexOf(cur);
    var nextF = visible[(vi < 0 ? 0 : vi + 1) % visible.length];
    selected = features.indexOf(nextF);
    setSlideIndex(selected, 0);
    if (isStackMode()) {
      refreshFeatureCard(selected);
      scrollSelectedCard(true);
      syncTourUi();
      syncLightboxFromState();
      if (tourMode === 'playing') scheduleAdvance();
    } else if (!lb.open) {
      paint();
    } else {
      renderNav();
      renderStage();
      syncTourUi();
      syncLightboxFromState();
      if (tourMode === 'playing') scheduleAdvance();
    }
  }

  function scheduleAdvance() {
    clearTourTimer();
    if (tourMode !== 'playing') return;
    var gen = ++tourGen;
    var s = slide();
    if (!s) return;
    var kind = slideMediaKind(s);
    syncMediaPlayback();
    syncLightboxPlayback();

    if (kind === 'video') {
      var vid = null;
      if (lb.open && lb.el) vid = lb.el.querySelector('video.tv-lb-el');
      if (!vid) {
        var scope = elStage.querySelector('.feature-card[data-feat="' + selected + '"]') || elStage;
        vid = scope.querySelector('video.media-el');
      }
      if (!vid) {
        tourTimer = setTimeout(function () {
          if (gen !== tourGen || tourMode !== 'playing') return;
          advanceTour();
        }, IMAGE_MS);
        return;
      }
      hydrateMedia(vid);
      var onEnded = function () {
        vid.removeEventListener('ended', onEnded);
        if (gen !== tourGen || tourMode !== 'playing') return;
        advanceTour();
      };
      vid.addEventListener('ended', onEnded);
      if (vid.ended) {
        tourTimer = setTimeout(function () {
          if (gen !== tourGen || tourMode !== 'playing') return;
          advanceTour();
        }, 250);
      }
      return;
    }

    tourTimer = setTimeout(function () {
      if (gen !== tourGen || tourMode !== 'playing') return;
      advanceTour();
    }, IMAGE_MS);
  }

  function setTourMode(mode, opts) {
    if (mode !== 'playing' && mode !== 'paused' && mode !== 'stopped') return;
    clearIdleTimer();
    clearTourTimer();
    tourGen += 1;
    tourMode = mode;
    // Remember hard stop across reloads; play clears it. Pause is session-only.
    if (mode === 'stopped' || mode === 'playing') persistTourMode(mode);
    syncTourUi();
    if (!isStackMode()) renderNav();
    syncMediaPlayback();
    syncLightboxPlayback();
    if (mode === 'playing') scheduleAdvance();
    if (mode === 'paused' && opts && opts.idleResume) {
      setTourHints('Resumes in 2s if idle');
      idleTimer = setTimeout(function () {
        idleTimer = null;
        if (tourMode === 'paused') setTourMode('playing');
      }, IDLE_MS);
    } else if (mode === 'paused') {
      setTourHints('Paused · press play');
    }
  }

  function noteInteraction() {
    if (suppressIdle) return;
    if (tourMode === 'stopped') return;
    // Soft-pause on interaction; resume after idle. Stop stays off.
    setTourMode('paused', { idleResume: true });
  }

  function selectFeature(i, fromTour) {
    if (i < 0 || i >= features.length) return;
    if (!isEnabled(features[i])) return;
    selected = i;
    setSlideIndex(i, 0);
    if (!fromTour) noteInteraction();
    if (isStackMode()) {
      syncStackSelection();
      scrollSelectedCard(true);
      syncTourUi();
      syncMediaPlayback();
      if (tourMode === 'playing') scheduleAdvance();
    } else {
      paint();
    }
    syncLightboxFromState();
  }

  function setSlide(i, fromTour, fi) {
    if (fi == null) fi = selected;
    var n = slidesOf(fi).length;
    if (i < 0 || i >= n) return;
    setSlideIndex(fi, i);
    if (!fromTour) {
      selected = fi;
      noteInteraction();
    }
    if (isStackMode()) {
      refreshFeatureCard(fi);
      syncTourUi();
      if (tourMode === 'playing' && fi === selected) scheduleAdvance();
    } else {
      renderNav();
      renderStage();
    }
    syncLightboxFromState();
  }

  function paint() {
    document.documentElement.classList.toggle('tv-stack', isStackMode());
    var explore = document.querySelector('.tv-explore');
    if (explore) explore.classList.toggle('tv-stack', isStackMode());
    if (isStackMode()) {
      if (elNav) elNav.innerHTML = '';
      renderStack();
    } else {
      renderNav();
      renderStage();
    }
    reportHeightSoon();
  }

  elNav.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-i]');
    if (!btn) return;
    playClick();
    selectFeature(Number(btn.getAttribute('data-i')));
  });

  /** Step slides; in stack mode stay inside the feature. Desktop wraps to next/prev feature. */
  function stepSlide(dir, fi) {
    if (fi == null) fi = selected;
    var list = slidesOf(fi);
    if (!list.length) return;
    var next = slideIndex(fi) + dir;
    if (next >= 0 && next < list.length) {
      setSlide(next, false, fi);
      return;
    }
    if (isStackMode()) return; // clamp — scroll the page for other features
    var visible = visibleFeatures();
    if (!visible.length) return;
    var vi = visible.indexOf(features[fi] || feat());
    if (vi < 0) vi = 0;
    var ni = (vi + dir + visible.length) % visible.length;
    var nfi = features.indexOf(visible[ni]);
    var nSlides = slidesOf(nfi).length;
    setSlideIndex(nfi, dir < 0 ? Math.max(0, nSlides - 1) : 0);
    selected = nfi;
    noteInteraction();
    paint();
    syncLightboxFromState();
  }

  /**
   * Horizontal swipe → prev/next slide on that feature card only.
   * Vertical = page scroll. Skip when media zoomed.
   */
  function bindStageSwipe() {
    var THRESH = 56;
    var swipe = null;
    var axis = null;

    function ignoreTarget(t) {
      if (!(t instanceof Element)) return true;
      return Boolean(t.closest('button, a, input, select, textarea, .tour-controls, .slide-nav, .media-ctas, video'));
    }

    elStage.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (ignoreTarget(e.target)) return;
      if (e.target.closest('.stage-media[data-zoomed]')) return;
      var card = e.target.closest('.feature-card') || elStage;
      var fiAttr = card.getAttribute && card.getAttribute('data-feat');
      var fi = fiAttr != null ? Number(fiAttr) : selected;
      swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, fi: fi, target: card };
      axis = null;
    });

    elStage.addEventListener('pointermove', function (e) {
      if (!swipe || e.pointerId !== swipe.id) return;
      var dx = e.clientX - swipe.x;
      var dy = e.clientY - swipe.y;
      if (!axis) {
        if (Math.hypot(dx, dy) < 12) return;
        axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
      }
      if (axis === 'x' && Math.abs(dx) > 8) {
        try { elStage.setPointerCapture(e.pointerId); } catch (_) {}
      }
    });

    function endSwipe(e) {
      if (!swipe || e.pointerId !== swipe.id) return;
      var dx = e.clientX - swipe.x;
      var dy = e.clientY - swipe.y;
      var fi = swipe.fi;
      var locked = axis;
      swipe = null;
      axis = null;
      try { elStage.releasePointerCapture(e.pointerId); } catch (_) {}
      if (locked === 'y') return;
      if (Math.abs(dx) < THRESH || Math.abs(dx) < Math.abs(dy) * 1.15) return;
      playClick();
      stepSlide(dx < 0 ? 1 : -1, fi);
    }

    elStage.addEventListener('pointerup', endSwipe);
    elStage.addEventListener('pointercancel', function (e) {
      if (swipe && e.pointerId === swipe.id) { swipe = null; axis = null; }
    });
  }
  bindStageSwipe();

  elStage.addEventListener('click', function (e) {
    var tourBtn = e.target.closest('.tour-controls [data-act]');
    if (tourBtn) {
      playClick();
      var act = tourBtn.getAttribute('data-act');
      suppressIdle = true;
      if (act === 'play') setTourMode('playing');
      else if (act === 'pause') setTourMode('paused');
      else if (act === 'stop') setTourMode('stopped');
      suppressIdle = false;
      return;
    }
    var stepBtn = e.target.closest('[data-feat-step]');
    if (stepBtn) {
      playClick();
      stepSlide(Number(stepBtn.getAttribute('data-feat-step')), Number(stepBtn.getAttribute('data-feat')));
      return;
    }
    var slideBtn = e.target.closest('[data-slide]');
    if (slideBtn) {
      playClick();
      var fi = slideBtn.getAttribute('data-feat');
      setSlide(Number(slideBtn.getAttribute('data-slide')), false, fi != null ? Number(fi) : selected);
      return;
    }
    if (e.target.closest('.stage-media')) noteInteraction();
  });

  elStage.addEventListener('wheel', function (e) {
    if (e.target.closest('.stage-media')) noteInteraction();
  }, { passive: true });

  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      playClick();
      applyTheme(themeName() === 'dark' ? 'light' : 'dark', true);
    });
  }

  // Host iframe (pm-pics iframe-widget): embed layout + theme + height pump
  enableEmbedLayout();
  /** Host ThemeProvider toggles html.light / html.dark (TopNavigation). */
  function hostDocumentTheme() {
    try {
      var cl = document.documentElement.classList;
      if (cl.contains('dark')) return 'dark';
      if (cl.contains('light')) return 'light';
    } catch (e) { /* ignore */ }
    return null;
  }
  try {
    var qTheme = new URLSearchParams(location.search).get('theme');
    if (qTheme === 'light' || qTheme === 'dark') applyTheme(qTheme, false);
    else {
      var hostT = hostDocumentTheme();
      if (hostT) applyTheme(hostT, false);
    }
  } catch (e) { /* ignore */ }
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'pm-theme' && (d.theme === 'light' || d.theme === 'dark')) {
      applyTheme(d.theme, false);
      reportHeightSoon();
    }
    if (d.type === 'pm-iframe-height-request') {
      reportHeightSoon();
    }
  });
  // Same-document HtmlWidget embed: follow host class changes without waiting on postMessage
  if (window.parent === window && typeof MutationObserver !== 'undefined') {
    var hostThemeMo = new MutationObserver(function () {
      var t = hostDocumentTheme();
      if (t && t !== themeName()) {
        applyTheme(t, false);
        reportHeightSoon();
      }
    });
    hostThemeMo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  }
  if (typeof ResizeObserver !== 'undefined') {
    var roRoot = document.querySelector('.shell') || document.querySelector('.tv-explore') || document.body;
    if (roRoot) {
      var ro = new ResizeObserver(function () { reportHeightSoon(); });
      ro.observe(roRoot);
    }
  }
  window.addEventListener('load', reportHeightSoon);
  window.addEventListener('orientationchange', reportHeightSoon);
  try {
    var mqStack = window.matchMedia('(max-width:900px)');
    var onStackMq = function () { paint(); };
    if (mqStack.addEventListener) mqStack.addEventListener('change', onStackMq);
    else if (mqStack.addListener) mqStack.addListener(onStackMq);
  } catch (e) { /* ignore */ }
  // Images/videos settling after first paint
  document.querySelectorAll('img,video').forEach(function (el) {
    el.addEventListener('load', reportHeightSoon);
    el.addEventListener('loadeddata', reportHeightSoon);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input,textarea,select')) return;
    if (lb.open) {
      if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); noteInteraction(); lightboxNav(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); noteInteraction(); lightboxNav(1); }
      else if (e.key === ' ') {
        e.preventDefault();
        playClick();
        suppressIdle = true;
        if (tourMode === 'playing') setTourMode('paused');
        else setTourMode('playing');
        suppressIdle = false;
      }
      return;
    }
    // Don't steal page scroll/keys when embed is not focused
    var root = document.querySelector('.tv-explore');
    if (root && !root.contains(e.target) && !(document.activeElement && root.contains(document.activeElement))) {
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault(); playClick();
      if (isStackMode()) {
        var vis = visibleFeatures();
        var vi = vis.indexOf(feat());
        if (vi >= 0 && vi < vis.length - 1) selectFeature(features.indexOf(vis[vi + 1]));
      } else {
        selectFeature(Math.min(features.length - 1, selected + 1));
      }
    }
    else if (e.key === 'ArrowUp') {
      e.preventDefault(); playClick();
      if (isStackMode()) {
        var visU = visibleFeatures();
        var viU = visU.indexOf(feat());
        if (viU > 0) selectFeature(features.indexOf(visU[viU - 1]));
      } else {
        selectFeature(Math.max(0, selected - 1));
      }
    }
    else if (e.key === 'ArrowRight') { e.preventDefault(); playClick(); stepSlide(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); playClick(); stepSlide(-1); }
    else if (e.key === ' ') {
      e.preventDefault();
      playClick();
      if (tourMode === 'playing') setTourMode('paused');
      else setTourMode('playing');
    }
  });

  // default: first enabled feature in product.json order
  var prefer = features.findIndex(isEnabled);
  selected = prefer >= 0 ? prefer : 0;
  paint();
})();

</script>
